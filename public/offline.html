<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1013">
<title>PCに接続できません</title>
<style>
:root { color-scheme: dark; --paper: #0d1013; --panel: #14181d; --rule: #2a3037; --ink: #f1f3f5; --muted: #a3abb4; --accent: #f7b83d; --accent-ink: #1d1503; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); background: var(--paper); color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif; line-height: 1.6; }
main { width: 100%; max-width: 30rem; padding: 24px; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); }
h1 { margin: 0 0 12px; font-size: 1.4rem; font-weight: 500; }
p, ol { margin: 0 0 12px; color: var(--muted); }
ol { padding-left: 1.4em; }
li + li { margin-top: 4px; }
button { width: 100%; min-height: 48px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 500; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>PCに接続できません</h1>
  <p>このアプリは PC 側のデータを直接見ています。次を確認してください。</p>
  <ol>
    <li>この端末の Tailscale が接続中か</li>
    <li>PC が起動していて、アプリのサーバーが動いているか</li>
  </ol>
  <button type="button" onclick="location.reload()">もう一度試す</button>
</main>
</body>
</html>
